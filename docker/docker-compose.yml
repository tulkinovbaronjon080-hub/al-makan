name: al-makan

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: al_makan
      POSTGRES_PASSWORD: al_makan
      POSTGRES_DB: al_makan
    ports:
      - "5432:5432"
    volumes:
      - al_makan_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U al_makan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - al_makan_redis:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: al_makan
      MINIO_ROOT_PASSWORD: al_makan_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - al_makan_minio:/data

volumes:
  al_makan_postgres:
  al_makan_redis:
  al_makan_minio:
